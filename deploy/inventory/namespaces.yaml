namespaces:
  - name: kube-system
    purpose: core k3s system workloads

  - name: tigera-operator
    purpose: Calico operator namespace

  - name: calico-system
    purpose: Calico node and controller workloads

  - name: traefik
    purpose: edge ingress controller

  - name: cert-manager
    purpose: TLS automation and ACME DNS-01

  - name: argocd
    purpose: GitOps controller and app definitions

  - name: apps
    purpose: legacy test namespace (whoami test app)

  - name: apps-dev
    purpose: development application workloads
    labels:
      kakde.eu/postgresql-access: "true"

  - name: apps-prod
    purpose: production application workloads
    labels:
      kakde.eu/postgresql-access: "true"

  - name: databases-prod
    purpose: internal PostgreSQL and related data services

  - name: identity
    purpose: Keycloak identity provider
    labels:
      kakde.eu/postgresql-access: "true"

  - name: monitoring
    purpose: observability stack (VictoriaMetrics, vmagent, node-exporter, kube-state-metrics, Grafana)

  - name: bytebase
    purpose: Bytebase database client, gated by oauth2-proxy against the `bytebase` Keycloak realm
    labels:
      # Declared on the Namespace object in deploy/apps/bytebase/base/namespace.yaml rather than
      # applied by label-access.sh, which only knows about apps-prod.
      kakde.eu/postgresql-access: "true"

  - name: dblab
    purpose: >-
      disposable polyglot database lab (postgres, mongodb, redis, elasticsearch, cassandra,
      dynamodb-local, kafka, kafbat-ui, rabbitmq). Fake seed data only; safe to destroy.
      NOT Argo-managed — created and removed by deploy/apps/dblab/scripts/lab-*.sh.

  - name: nettest
    purpose: network testing namespace
