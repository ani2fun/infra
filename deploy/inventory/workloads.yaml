# Workload catalog. The image_digest values are captured at snapshot time
# (see deploy/dr/SNAPSHOT.md) and are the source of truth on rebuild.
# Tags drift; digests don't.
#
# Refresh by running: scripts/dr/snapshot-live-state.sh
workloads:
  - name: codefolio
    namespace: apps-prod
    kind: Deployment
    managed_by: argocd
    source_path: deploy/apps/codefolio/overlays/prod
    image: ghcr.io/ani2fun/codefolio:latest
    # image_digest captured at next snapshot run (scripts/dr/snapshot-live-state.sh)
    replicas: 2
    service:
      name: codefolio
      port: 80
      target_port: 8080
    ingress:
      host: kakde.eu
      tls_secret: kakde-eu-tls
      cluster_issuer: letsencrypt-prod-dns01
    secrets:
      - codefolio-db   # SealedSecret committed at deploy/apps/codefolio/overlays/prod/sealedsecret.yaml
    backing_stores:
      - postgres: postgresql.databases-prod.svc.cluster.local:5432/codefolio (shared)
      - redis: codefolio-redis.apps-prod (in-namespace, ephemeral cache)
      - mongo: codefolio-mongo.apps-prod (in-namespace, ephemeral event log)

  - name: codefolio-redis
    namespace: apps-prod
    kind: Deployment
    managed_by: argocd
    source_path: deploy/apps/codefolio/overlays/prod
    image: redis:7-alpine
    replicas: 1
    persistence: ephemeral   # cache only; no PVC
    service:
      name: codefolio-redis
      port: 6379
      target_port: 6379

  - name: codefolio-mongo
    namespace: apps-prod
    kind: Deployment
    managed_by: argocd
    source_path: deploy/apps/codefolio/overlays/prod
    image: mongo:7
    replicas: 1
    persistence: ephemeral   # emptyDir on /data/db; event log resets on pod restart
    service:
      name: codefolio-mongo
      port: 27017
      target_port: 27017

  - name: codefolio-dev
    namespace: apps-dev
    kind: Deployment
    managed_by: kustomize
    source_path: deploy/apps/codefolio/overlays/dev
    image_source: overlay-resolved
    service:
      name: codefolio
      port: 80
      target_port: 8080
    ingress:
      host: dev.codefolio.kakde.eu
      tls_secret: dev-codefolio-kakde-eu-tls
      cluster_issuer: letsencrypt-staging-dns01

  # NOTE: piston and dsa-tracker (backend + frontend) were retired and removed
  # (2026-06-15). go-judge replaced piston as the in-cluster code runner and was
  # itself retired (2026-08-20) once codefolio went static; synapse-go-judge is
  # now the only code runner. cortex / cortex-tutor are parked in
  # platform/argocd/applications/inactive/. This file still predates the synapse
  # and likec4 apps — refresh it from live state
  # (deploy/live-capture/collect-live-state.sh) to add them.

  - name: postgresql
    namespace: databases-prod
    kind: StatefulSet
    managed_by: kubectl-manifests
    source_path: deploy/platform/postgresql/
    image: postgres:17.9
    image_digest: sha256:2cd82735a36356842d5eb1ef80db3ae8f1154172f0f653db48fde079b2a0b7f7
    replicas: 1
    pvc:
      storage_class: local-path
      size: 80Gi
    access:
      service: postgresql.databases-prod.svc.cluster.local:5432
      namespace_access_label: kakde.eu/postgresql-access=true

  - name: keycloak
    namespace: identity
    kind: Deployment
    managed_by: kubectl-manifests
    source_path: deploy/apps/keycloak/
    image: quay.io/keycloak/keycloak:26.5.5
    image_digest: sha256:a7b0cb7a43a1235a61872883414d3f1d9a3ceac9df6e5907bd12202778a6265c
    replicas: 1
    service:
      name: keycloak
      port: 80
      target_port: 8080
    ingress:
      host: keycloak.kakde.eu
      tls_secret: keycloak-tls
      cluster_issuer: letsencrypt-prod-dns01
    secrets:
      - keycloak-admin-secret
      - keycloak-db-secret
      - keycloak-github-oauth   # SealedSecret committed at deploy/apps/keycloak/overlays/prod/github-oauth-sealedsecret.yaml
    database:
      type: postgres
      host: postgresql.databases-prod.svc.cluster.local
      port: 5432
      name: keycloak

  - name: argocd
    namespace: argocd
    kind: platform
    managed_by: kubectl + manual patches
    image: quay.io/argoproj/argocd:v3.3.3
    image_digest: sha256:8b9a0993937850c1ee6e2ada47a2be8259d512e959ae58afa39936658f7b52e7
    host: argocd.kakde.eu
    pinned_node_label:
      workload: argocd
    internal_tls_disabled: true

  # --- Observability stack (monitoring namespace, Argo-synced, metrics-only) ---
  - name: vmsingle
    namespace: monitoring
    kind: Deployment
    managed_by: argocd
    source_path: deploy/apps/monitoring/overlays/prod
    image: victoriametrics/victoria-metrics:v1.144.0
    replicas: 1
    pinned_node: wk-1   # local-path PVC is node-local; pinned by hostname
    pvc:
      storage_class: local-path
      size: 20Gi
      retention: 30d
    service:
      name: vmsingle
      port: 8428
      target_port: 8428

  - name: vmagent
    namespace: monitoring
    kind: Deployment
    managed_by: argocd
    source_path: deploy/apps/monitoring/overlays/prod
    image: victoriametrics/vmagent:v1.144.0
    replicas: 1
    remote_write: http://vmsingle.monitoring.svc.cluster.local:8428/api/v1/write

  - name: node-exporter
    namespace: monitoring
    kind: DaemonSet
    managed_by: argocd
    source_path: deploy/apps/monitoring/overlays/prod
    image: prom/node-exporter:v1.11.1
    notes: runs on all 4 nodes (tolerates control-plane + edge taints); hostNetwork :9100

  - name: kube-state-metrics
    namespace: monitoring
    kind: Deployment
    managed_by: argocd
    source_path: deploy/apps/monitoring/overlays/prod
    image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.19.1
    replicas: 1
    service:
      name: kube-state-metrics
      port: 8080
      target_port: 8080

  - name: grafana
    namespace: monitoring
    kind: Deployment
    managed_by: argocd
    source_path: deploy/apps/monitoring/overlays/prod
    image: grafana/grafana:13.0.2
    replicas: 1
    persistence: ephemeral   # emptyDir; datasource + dashboards provisioned from Git
    service:
      name: grafana
      port: 80
      target_port: 3000
    ingress:
      host: grafana.kakde.eu
      tls_secret: grafana-kakde-eu-tls
      cluster_issuer: letsencrypt-prod-dns01
    auth: github-oauth (locked to GitHub user ani2fun via role_attribute_path + strict mode)
    secrets:
      - grafana-github-oauth   # SealedSecret at deploy/apps/monitoring/overlays/prod/grafana-github-oauth-sealedsecret.yaml
      - grafana-admin          # SealedSecret (break-glass local login)

  # ---------------------------------------------------------------------------
  # Bytebase — durable database client, gated by Keycloak via oauth2-proxy.
  # Added 2026-08-10. See deploy/apps/bytebase/OPERATIONS.md.
  # ---------------------------------------------------------------------------
  - name: bytebase
    namespace: bytebase
    kind: Deployment
    managed_by: manual   # becomes argocd once deploy/apps/bytebase/ is pushed
    source_path: deploy/apps/bytebase/overlays/prod
    image: bytebase/bytebase:3.21.0
    replicas: 1
    node: wk-1   # pinned by hostname; local-path PVC is node-local
    persistence: pvc bytebase-data (5Gi, local-path) — working dir only, NOT the metadata store
    service:
      name: bytebase
      port: 80
      target_port: 8080
    ingress: none   # deliberately: the Ingress points at the oauth2-proxy, never here
    auth: >-
      none of its own on this licence. Bytebase's OIDC SSO is Enterprise-only, so access is gated
      at the door by bytebase-oauth2-proxy. Bytebase keeps a separate local admin account.
    backing_stores:
      - postgres: postgresql.databases-prod.svc.cluster.local:5432/bytebase_meta (shared; in DR backup scope)
    manages:
      - postgresql.databases-prod (via the `bytebase` role — full DDL+DML on granted databases, not superuser)
      - the six dblab engines
    secrets:
      - bytebase-db   # SealedSecret at deploy/apps/bytebase/overlays/prod/sealedsecret-db.yaml

  - name: bytebase-oauth2-proxy
    namespace: bytebase
    kind: Deployment
    managed_by: manual
    source_path: deploy/apps/bytebase/overlays/prod
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
    replicas: 1
    node: wk-1
    service:
      name: bytebase-oauth2-proxy
      port: 4180
      target_port: 4180
    ingress:
      host: bytebase.kakde.eu
      tls_secret: bytebase-kakde-eu-tls
      cluster_issuer: letsencrypt-prod-dns01
    auth: >-
      OIDC against https://keycloak.kakde.eu/realms/bytebase (client bytebase-proxy, PKCE S256).
      Access policy is --allowed-group=bytebase-admins; membership is managed with
      scripts/secrets/grant-bytebase-admin.sh. NOTE the flag is singular.
    secrets:
      - bytebase-oauth2-proxy   # SealedSecret at deploy/apps/bytebase/overlays/prod/sealedsecret-oauth2-proxy.yaml

  # ---------------------------------------------------------------------------
  # dblab — disposable polyglot lab. NOT Argo-managed on purpose: selfHeal+prune
  # would resurrect the namespace the moment lab-nuke.sh removed it.
  # Lifecycle: deploy/apps/dblab/scripts/lab-{up,stop,nuke,verify}.sh
  # ---------------------------------------------------------------------------
  - name: dblab
    namespace: dblab
    kind: Deployment x9
    managed_by: manual   # scripts only — deliberately never Argo
    source_path: deploy/apps/dblab/base (engines) + deploy/apps/dblab/seed (seed Jobs)
    node: wk-1   # every workload pinned by hostname; 8 local-path PVCs
    ingress: none   # ClusterIP only; reached from Bytebase or via kubectl port-forward
    engines:
      - postgres:17                          # 5432
      - mongo:8                              # 27017
      - redis:8-alpine                       # 6379
      - elasticsearch:8.19.19                # 9200  (xpack.security disabled)
      - cassandra:5                          # 9042  (PasswordAuthenticator, cassandra/cassandra)
      - amazon/dynamodb-local:3.3.1          # 8000  (-sharedDb)
      - apache/kafka:4.3.1                   # 9092  (KRaft; needs publishNotReadyAddresses)
      - ghcr.io/kafbat/kafka-ui:v1.0.0       # 8080
      - rabbitmq:4-management                # 5672 / 15672
    secrets:
      - dblab-credentials   # generated by lab-up.sh, NOT committed and NOT sealed
    measured_usage: ~3.8Gi memory, ~230m CPU idle (2026-08-10)
