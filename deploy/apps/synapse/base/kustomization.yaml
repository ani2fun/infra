apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # The shared content checkout, and the Deployment that writes it. git-sync is NOT a sidecar:
  # pod readiness is the AND of every container, so a sidecar that dies 404s the whole site.
  - pvc.yaml
  - content-sync-deployment.yaml
  - deployment.yaml
  - service.yaml
