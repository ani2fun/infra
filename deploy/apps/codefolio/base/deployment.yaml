apiVersion: apps/v1
kind: Deployment
metadata:
  name: codefolio
spec:
  # Two replicas plus maxUnavailable 0: a deploy starts a new pod and waits for it to be Ready
  # before it stops an old one, and losing one pod (crash, eviction, node drain) still leaves
  # one serving.
  #
  # Deliberately NO PodDisruptionBudget. The prod overlay pins this Deployment to
  # `kakde.eu/edge: "true"`, and exactly one node carries that label (vm-1 / ctb-edge-1, see
  # deploy/inventory/nodes.yaml). A PDB protects a workload by assuming an evicted pod can be
  # rescheduled elsewhere; a pod that cannot move anywhere never restores currentHealthy, so the
  # budget drops to disruptionsAllowed: 0 after the first eviction and blocks the drain for good.
  # That cost the 2026-11-18 upgrade a 300 s drain timeout for no gain: Traefik is edge-only too,
  # so *.kakde.eu is down for the whole reboot whether or not codefolio keeps a replica. See
  # deploy/dr/UPGRADE.md U4.1.
  #
  # Restore a PDB (maxUnavailable: 1) the moment a second node carries `kakde.eu/edge` — then the
  # pods can move and the budget protects instead of blocks.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: codefolio
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codefolio
        app.kubernetes.io/component: app
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: codefolio
          image: ghcr.io/ani2fun/codefolio:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # Static portfolio — no databases, no auth, no code-runner. Just the listen port; the server
          # serves the Vite bundle from /app/static and a trivial /api/health for the probes below.
          env:
            - name: PORT
              value: "8080"
          # Keep serving for 5 s after the pod is marked terminating. Traefik needs a moment to
          # drop the pod from its endpoints; without the pause a rollout returned a few 502s.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      securityContext:
        seccompProfile:
          type: RuntimeDefault
