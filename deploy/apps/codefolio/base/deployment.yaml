apiVersion: apps/v1
kind: Deployment
metadata:
  name: codefolio
spec:
  # Two replicas plus maxUnavailable 0: a deploy starts a new pod and waits for it to be Ready
  # before it stops an old one, and losing one pod (crash, eviction, node drain) still leaves
  # one serving. The PodDisruptionBudget in pdb.yaml keeps a drain from evicting both at once.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: codefolio
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codefolio
        app.kubernetes.io/component: app
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: codefolio
          image: ghcr.io/ani2fun/codefolio:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # Static portfolio — no databases, no auth, no code-runner. Just the listen port; the server
          # serves the Vite bundle from /app/static and a trivial /api/health for the probes below.
          env:
            - name: PORT
              value: "8080"
          # Keep serving for 5 s after the pod is marked terminating. Traefik needs a moment to
          # drop the pod from its endpoints; without the pause a rollout returned a few 502s.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      securityContext:
        seccompProfile:
          type: RuntimeDefault
