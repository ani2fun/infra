---
# Grafana unified alerting, provisioned from files (Grafana 13 reads every *.yaml under
# /etc/grafana/provisioning/alerting at boot). Provisioned objects are READ-ONLY in the UI —
# edit them here, not in the browser.
#
# There is no vmalert and no Alertmanager in this cluster: Grafana already holds the
# VictoriaMetrics datasource and its own evaluator, so a rule here costs no extra workload on a
# RAM-tight cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: monitoring
data:
  contactpoints.yaml: |
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: email-admin
        receivers:
          - uid: email-admin
            type: email
            settings:
              # The dedicated service mailbox, which is also the SMTP sender — Gmail delivers
              # to self without complaint. Deliberately NOT a personal address: nothing in this
              # stack should pin alerting to one human's inbox. Forward it from Gmail, or add
              # recipients here as a semicolon-separated list.
              addresses: synapse.kakde.eu@gmail.com
              singleEmail: true

  policies.yaml: |
    apiVersion: 1
    policies:
      # REPLACES the default policy tree, so every alert in this Grafana routes here.
      - orgId: 1
        receiver: email-admin
        group_by:
          - grafana_folder
          - alertname
        # Slow on purpose. Nothing here is pageable — these are "go look when convenient"
        # alerts, and a homelab mailbox should not get a message every 5 minutes.
        group_wait: 1m
        group_interval: 10m
        repeat_interval: 12h

  rules.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: synapse
        folder: Synapse
        interval: 1m
        rules:
          - uid: synapse-git-sync-stalled
            title: Synapse content sync stalled
            # WHY THIS EXISTS: git-sync runs with --max-failures=-1, so a persistently failing
            # fetch no longer crashes the container — which is the whole point, because a dead
            # git-sync takes synapse.kakde.eu to a hard 404. The cost of that fix is that failure
            # is now SILENT: the site stays up serving stale content and nothing complains. This
            # rule is the replacement signal.
            condition: C
            data:
              # COUNTS noop AS HEALTHY, and that is the load-bearing detail. git-sync records
              # `success` only when the checkout actually CHANGED (`changed || syncCount == 0`);
              # an unchanged repo records `noop`. Prose is published rarely, so alerting on
              # `success` alone would fire on a perfectly healthy sidecar almost all the time.
              # What "healthy" really means is: a fetch COMPLETED, changed or not.
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: victoriametrics
                model:
                  refId: A
                  editorMode: code
                  instant: true
                  range: false
                  expr: sum(increase(git_sync_count_total{namespace="apps-prod", status=~"success|noop"}[15m]))
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: A
                  datasource:
                    type: __expr__
                    uid: __expr__
                  conditions:
                    - type: query
                      evaluator:
                        type: lt
                        params:
                          - 1
                      operator:
                        type: and
                      reducer:
                        type: last
                        params: []
                      query:
                        params:
                          - C
            # A fetch every 60s means ~15 completions per window; zero means it is stuck.
            for: 5m
            # NoData is a REAL alert here, not noise to suppress: it means the git-sync container
            # is gone, not scraped, or never came back — which is exactly the condition where the
            # `== 0` expression has no series to match and would otherwise stay silent forever.
            noDataState: Alerting
            execErrState: Alerting
            labels:
              severity: warning
              app: synapse
            annotations:
              summary: synapse content sync has not completed a fetch in 15 minutes
              description: >-
                git-sync in apps-prod/synapse has completed no successful fetch (changed or
                unchanged) for 15 minutes. The site stays UP on the last good checkout, so this
                is not an outage — but prose published to synapse-content is no longer reaching
                production. Check `kubectl -n apps-prod logs -l app.kubernetes.io/name=synapse
                -c git-sync` for "error syncing repo, will retry"; a persistent GitHub 401 there
                usually means the PAT in the synapse-github secret has expired.

      - orgId: 1
        name: argocd
        folder: ArgoCD
        interval: 1m
        rules:
          - uid: argocd-component-unhealthy
            title: Argo CD component not ready
            # WHY THIS EXISTS: a repo-server pod sat stuck in phase Unknown for days with no
            # signal anywhere except Argo's own ComparisonError, discovered by chance. Argo CD
            # has no self-alerting, so its own control plane needs the same kind of outside
            # watchdog as any other workload.
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: victoriametrics
                model:
                  refId: A
                  editorMode: code
                  instant: true
                  range: false
                  # kube-state-metrics emits kube_pod_status_ready with condition true/false/unknown
                  # per pod (all three, one of them 1). A pod's Ready condition going to literal
                  # "Unknown" is exactly the kubelet-zombie failure mode this rule exists to catch.
                  expr: sum(kube_pod_status_ready{namespace="argocd", condition!="true"})
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: A
                  datasource:
                    type: __expr__
                    uid: __expr__
                  conditions:
                    - type: query
                      evaluator:
                        type: gt
                        params:
                          - 0
                      operator:
                        type: and
                      reducer:
                        type: last
                        params: []
                      query:
                        params:
                          - C
            # Long enough to skip a normal rollout restart, short enough to beat "discovered
            # days later by accident."
            for: 10m
            # NoData means kube-state-metrics itself is gone — worth knowing, not noise.
            noDataState: Alerting
            execErrState: Alerting
            labels:
              severity: warning
              app: argocd
            annotations:
              summary: an Argo CD component has not been Ready for 10 minutes
              description: >-
                One or more pods in the argocd namespace have not reported Ready for 10+
                minutes. Check `kubectl -n argocd get pods -o wide` for phase and restart
                counts. A pod stuck in phase Unknown is a kubelet-level zombie, not an app
                bug — force-delete it (`kubectl delete pod <name> -n argocd --force
                --grace-period=0`); the owning Deployment/StatefulSet recreates it clean.
                A CrashLoopBackOff or Pending pod needs `kubectl describe pod` to see why.
                A repo-server with init container `copyutil` failing on `/bin/ln: Already exists`
                means the version pin in deploy/platform/argocd/kustomization.yaml was lowered
                below v3.6 (fixed there on 2026-11-18).

      - orgId: 1
        name: cluster
        folder: Cluster
        interval: 1m
        rules:
          - uid: pod-crashloop
            title: Pod stuck in CrashLoopBackOff
            # WHY THIS EXISTS: Argo CD's repo-server crash-looped for 4 days in Nov 2026 (init
            # container `copyutil`). The argocd rule above saw it as "not Ready", but a crash loop
            # in ANY namespace (app, platform, monitoring) means the same thing: something will not
            # recover on its own. Covers init containers too, which is where that one failed.
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: victoriametrics
                model:
                  refId: A
                  editorMode: code
                  instant: true
                  range: false
                  # Both metric names in one selector: main containers and init containers.
                  expr: count({__name__=~"kube_pod_(init_)?container_status_waiting_reason", reason="CrashLoopBackOff"} == 1)
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: A
                  datasource:
                    type: __expr__
                    uid: __expr__
                  conditions:
                    - type: query
                      evaluator:
                        type: gt
                        params:
                          - 0
                      operator:
                        type: and
                      reducer:
                        type: last
                        params: []
                      query:
                        params:
                          - C
            for: 30m
            # `sum(...)` over no matching series is empty, not 0, so NoData here is the healthy
            # case (nothing crash-looping, nothing cordoned), unlike the rules above.
            noDataState: OK
            execErrState: Alerting
            labels:
              severity: warning
              app: cluster
            annotations:
              summary: a pod has been crash-looping for 30 minutes
              description: >-
                A container or init container has been in CrashLoopBackOff for 30+ minutes.
                It will not fix itself. Find it with `kubectl get pods -A | grep -i crash`, then
                read `kubectl -n <ns> describe pod <pod>` and `kubectl -n <ns> logs <pod> -c
                <container> --previous`.
          - uid: node-cordoned
            title: Node left cordoned
            # WHY THIS EXISTS: kured cordons a worker, drains it, reboots, and uncordons when it
            # comes back. If the node does not come back cleanly, or a manual drain is forgotten,
            # the node stays unschedulable with no other signal. A kured reboot takes minutes, so
            # 2 hours cordoned means something went wrong.
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: victoriametrics
                model:
                  refId: A
                  editorMode: code
                  instant: true
                  range: false
                  expr: sum(kube_node_spec_unschedulable > 0)
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: A
                  datasource:
                    type: __expr__
                    uid: __expr__
                  conditions:
                    - type: query
                      evaluator:
                        type: gt
                        params:
                          - 0
                      operator:
                        type: and
                      reducer:
                        type: last
                        params: []
                      query:
                        params:
                          - C
            for: 2h
            # `sum(...)` over no matching series is empty, not 0, so NoData here is the healthy
            # case (nothing crash-looping, nothing cordoned), unlike the rules above.
            noDataState: OK
            execErrState: Alerting
            labels:
              severity: warning
              app: cluster
            annotations:
              summary: a node has been cordoned for 2 hours
              description: >-
                A node has been unschedulable for 2+ hours. Check `kubectl get nodes` and
                `kubectl describe node <name>` (kured's weave.works/kured-* annotations show
                whether a reboot is in progress). Check `kubectl -n kube-system logs -l
                name=kured`. If the node is healthy, run `kubectl uncordon <name>`.
