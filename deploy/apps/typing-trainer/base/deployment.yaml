apiVersion: apps/v1
kind: Deployment
metadata:
  name: typing-trainer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: typing-trainer
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: typing-trainer
        app.kubernetes.io/component: app
    spec:
      terminationGracePeriodSeconds: 10
      automountServiceAccountToken: false
      # keep the namespace's service links out of the env (PORT and friends)
      enableServiceLinks: false
      # the image is private on GHCR; the overlay ships this as a SealedSecret
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: typing-trainer
          image: ghcr.io/ani2fun/glove80-typing-trainer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # Tangent (Glove80 typing trainer): one page served by a small Node server.
          # With no env this is static mode (progress only in the visitor's browser); the
          # prod overlay adds Keycloak sign-in and Postgres sync. /healthz never touches
          # the database, so the trainer stays up when Postgres or Keycloak is down.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000 # the image's node user
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # the root filesystem is read-only; give Node a scratch /tmp anyway
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
      securityContext:
        seccompProfile:
          type: RuntimeDefault
