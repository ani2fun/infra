apiVersion: apps/v1
kind: Deployment
metadata:
  name: typing-trainer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: typing-trainer
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: typing-trainer
        app.kubernetes.io/component: app
    spec:
      terminationGracePeriodSeconds: 10
      automountServiceAccountToken: false
      # the image is private on GHCR; the overlay ships this as a SealedSecret
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: typing-trainer
          image: ghcr.io/ani2fun/glove80-typing-trainer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # Tangent (Glove80 typing trainer): one static page served by unprivileged nginx.
          # All progress lives in the visitor's browser, so there is no state, no secrets, no DB.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # nginx-unprivileged keeps its pid and temp files in /tmp
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
      securityContext:
        seccompProfile:
          type: RuntimeDefault
