# DynamoDB Local.
#
# The brief flagged this as the highest-risk item — whether Bytebase can be pointed at a local
# endpoint at all, or whether it insists on real AWS. RESOLVED FROM SOURCE, not guesswork:
# backend/plugin/db/dynamodb/dynamodb.go builds a custom base endpoint from the data source,
#
#   dynamoDBEndpoint(ds) -> "http://<host>:<port>"   (https:// when Use SSL is ticked)
#
# and only falls back to real AWS endpoint resolution when the host field is left empty. So
# registering host=dynamodb-local.dblab.svc.cluster.local, port=8000 is supported behaviour.
# Region and access key/secret are still required fields; any dummy values work locally.
#
# -sharedDb makes every client see ONE table set regardless of which credentials they present.
# Without it, DynamoDB Local partitions tables per access-key, and the AWS CLI would appear to
# see a completely different (empty) database than Bytebase does.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dynamodb-local-data
  labels:
    app.kubernetes.io/name: dynamodb-local
    app.kubernetes.io/part-of: dblab
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamodb-local
  labels:
    app.kubernetes.io/name: dynamodb-local
    app.kubernetes.io/part-of: dblab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dynamodb-local
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dynamodb-local
        app.kubernetes.io/part-of: dblab
    spec:
      nodeSelector:
        kubernetes.io/hostname: wk-1
      # The image runs as uid 1000 (dynamodblocal) and must own -dbPath.
      securityContext:
        fsGroup: 1000
      containers:
        - name: dynamodb-local
          image: amazon/dynamodb-local:3.3.1
          command:
            - java
            - -jar
            - DynamoDBLocal.jar
            - -sharedDb
            - -dbPath
            - /home/dynamodblocal/data
          ports:
            - name: http
              containerPort: 8000
          # DynamoDB Local has no health endpoint. An unauthenticated POST returns an HTTP-level
          # error rather than a connection failure, so a TCP check is the honest signal here.
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 768Mi }
          volumeMounts:
            - name: data
              mountPath: /home/dynamodblocal/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dynamodb-local-data
---
apiVersion: v1
kind: Service
metadata:
  name: dynamodb-local
  labels:
    app.kubernetes.io/name: dynamodb-local
    app.kubernetes.io/part-of: dblab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dynamodb-local
  ports:
    - name: http
      port: 8000
      targetPort: http
