apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: dblab
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: dblab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: dblab
    spec:
      nodeSelector:
        kubernetes.io/hostname: wk-1
      containers:
        - name: redis
          image: redis:8-alpine
          # requirepass comes from the env rather than the command line so the password never
          # shows up in `ps` inside the container.
          #
          # --databases 2 trims Redis's default SIXTEEN logical databases (db0..db15) down to
          # db0 and db1. Bytebase lists every logical database it finds, so the default fills
          # its sidebar with fourteen permanently-empty entries and buries the one that has
          # data. All seed data lives in db0; db1 is kept only so the concept is still visible.
          #
          # Safe to lower here because nothing has ever written above db0 (verified via
          # INFO keyspace). Raising it again is free; lowering it on an instance that DOES hold
          # data in a higher database would make the AOF fail to replay on the next restart.
          command: ["sh", "-c", "exec redis-server --requirepass \"$REDIS_PASSWORD\" --appendonly yes --databases 2"]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: dblab-credentials, key: redis-password } }
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: { port: redis }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 50m,  memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: dblab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
