# Default-deny ingress for the whole lab, then the two flows that must work.
#
# Ingress only — egress stays open so seed Jobs can pull images and reach each engine.
#
# Nothing here is exposed through Traefik, so the lab is only reachable from Bytebase, from
# inside the namespace, or via `kubectl port-forward`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dblab-default-deny-ingress
  labels:
    app.kubernetes.io/part-of: dblab
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Bytebase is the whole point of the lab, so it gets in. Ports are enumerated rather than
# left open so that adding a new engine is a deliberate edit here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dblab-allow-from-bytebase
  labels:
    app.kubernetes.io/part-of: dblab
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bytebase
      ports:
        - { protocol: TCP, port: 5432 }   # postgres
        - { protocol: TCP, port: 27017 }  # mongodb
        - { protocol: TCP, port: 6379 }   # redis
        - { protocol: TCP, port: 9200 }   # elasticsearch
        - { protocol: TCP, port: 9042 }   # cassandra
        - { protocol: TCP, port: 8000 }   # dynamodb-local
---
# Intra-namespace traffic: Kafbat UI -> Kafka, and every seed Job -> its engine.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dblab-allow-intra-namespace
  labels:
    app.kubernetes.io/part-of: dblab
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dblab
