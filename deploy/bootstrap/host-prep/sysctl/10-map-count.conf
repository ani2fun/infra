# Raise the per-process limit on virtual memory areas (mmap regions).
#
# Recovered into the repo on 2026-08-10: this file was already live on wk-1 at
# vm.max_map_count=1048576 but existed nowhere under deploy/, so a rebuilt node would have come
# back at the Ubuntu default of 65530. Elasticsearch REQUIRES at least 262144 and refuses to
# start below it, which would have broken the dblab lab on the first rebuild with an error that
# looks nothing like "a sysctl is missing".
#
# The value matches what Ubuntu ships in newer releases:
# https://bugs.launchpad.net/ubuntu/+source/procps/+bug/2057792
#
# Installed on every node by prepare-host.sh. Harmless where nothing needs it — this raises a
# ceiling, it does not reserve memory.
vm.max_map_count = 1048576
