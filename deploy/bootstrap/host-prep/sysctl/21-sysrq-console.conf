# Home nodes only (ms-1, wk-1, wk-2) — installed by prepare-host.sh.
#
# Magic SysRq fully enabled so a wedged-but-alive node can be rebooted SAFELY from
# a physically-attached keyboard (Alt+SysRq+R,E,I,S,U,B) instead of a hard power
# cut that risks node-local data. See deploy/dr/node-console-recovery.md.
#
# Split out of 20-oom-resilience.conf on 2026-11-19 when OOM auto-recovery was
# extended to the edge node. The edge is a headless Contabo VM with no attached
# keyboard, and its stock image ships a deliberately narrowed kernel.sysrq=176 in
# /etc/sysctl.d/10-magic-sysrq.conf. A 20-prefixed file would have overridden that
# with the more permissive 1 for no operational gain, so sysrq stays home-only.
kernel.sysrq = 1
