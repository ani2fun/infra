# Node OOM resilience — installed on every node by prepare-host.sh.
#
# Added after the 2026-06-13 wk-1 outage: a 26 GB desktop session drove the node
# into node-wide OOM, and with vm.panic_on_oom=0 the kernel thrashed instead of
# rebooting, so the node wedged for ~7h until a manual power-cycle. These settings
# make a node that exhausts memory REBOOT ITSELF (self-heal) instead of hanging.
#
# vm.panic_on_oom=1 panics only on *node-wide* OOM. A pod that hits its own cgroup
# memory limit is still handled by a normal pod OOM-kill — this does NOT reboot the
# node for a single misbehaving pod, only when the whole node is truly out of memory.
vm.panic_on_oom = 1
kernel.panic = 10
kernel.panic_on_oops = 1
# Larger free reserve so the kernel/network stack don't starve before the OOM
# killer (or a kubelet eviction) can act.
vm.min_free_kbytes = 131072
#
# THIS FILE ALONE IS NOT ENOUGH — the kubelet overwrites vm.panic_on_oom.
# -----------------------------------------------------------------------
# systemd-sysctl.service applies this file at boot and gets it right. Ten to thirty
# seconds later k3s starts, and the kubelet's container manager enforces its own
# expected kernel values (setupKernelTunables). Without --protect-kernel-defaults
# the kubelet rewrites any mismatch *silently* — the log line is V(2), which k3s
# never prints at its default verbosity, so nothing appears in the journal.
#
# The kubelet's expected set is exactly:
#     vm.overcommit_memory   = 1
#     vm.panic_on_oom        = 0   <-- fights the line above
#     kernel.panic           = 10  (agrees)
#     kernel.panic_on_oops   = 1   (agrees)
#     kernel.keys.root_maxkeys  = 1000000
#     kernel.keys.root_maxbytes = 25000000
#
# Only vm.panic_on_oom conflicts. vm.overcommit_memory is declared below so this
# file states the full live truth rather than letting the kubelet set it invisibly;
# the value is identical, so declaring it changes nothing today, and it is what a
# future --protect-kernel-defaults=true would require to be present at boot.
vm.overcommit_memory = 1
#
# systemd/oom-resilience-reassert.{service,timer} re-applies this file after the
# kubelet has settled, and keeps re-applying it so a k3s restart or upgrade cannot
# leave the node unprotected. Verified by gate L0-D in deploy/dr/gates.md.
