apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgresql-default-deny-ingress
  namespace: databases-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgresql-allow-from-selected-namespaces
  namespace: databases-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases-prod
        - namespaceSelector:
            matchLabels:
              kakde.eu/postgresql-access: "true"
      ports:
        - protocol: TCP
          port: 5432
---
# Host-network access from wk-1, the node that hosts the pod.
#
# Host-network clients (`ssh -L` tunnels, root `psql` on the node) have no pod
# identity, so podSelector/namespaceSelector can never match them -- ipBlock is
# the only rule type that can. Two CIDRs because either address can be the
# source depending on the route: 172.27.15.11 is wk-1 on the cluster VLAN,
# 192.168.15.3 is wk-1 on the LAN. See deploy/inventory/nodes.yaml.
#
# scripts/pg-tunnel.sh depends on this policy.
#
# THIS ONLY WORKS FROM wk-1, and the reason is not obvious. wk-1 hosts the pod,
# so its traffic is delivered straight over the pod veth and Calico sees wk-1's
# real host IP. An equivalent policy for any OTHER node cannot work: the pool
# default-ipv4-ippool runs vxlanMode: Always, so traffic from a non-hosting node
# crosses the overlay and workload ingress is enforced on the decapsulated inner
# packet -- whose source is that node's VXLAN tunnel address, not its host IP.
#
# A postgresql-allow-from-ms1-host policy naming ms-1's real host IPs lived here
# and in the cluster until Aug 2026 and never matched anything; it was deleted
# once measured. Do not recreate it, for ms-1 or any other non-hosting node.
# Adding the tunnel address instead is also wrong: Calico assigns it from IPAM
# and it changes on node rebuild. Route host-level access through wk-1, or use
# `kubectl exec`, which bypasses NetworkPolicy entirely. The failure mode is a
# connection timeout, which reads like a network fault rather than a denial.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgresql-allow-from-wk1-host
  namespace: databases-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 172.27.15.11/32
        - ipBlock:
            cidr: 192.168.15.3/32
      ports:
        - protocol: TCP
          port: 5432
